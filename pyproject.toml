[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "folklore-eval"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24", "Pillow>=10", "anthropic[vertex]>=0.70", "google-genai>=1.0", "python-dotenv>=1.0", "jsonschema>=4.18"]

[project.scripts]
folklore-eval = "folklore_eval.cli:main"

[tool.setuptools.packages.find]
include = ["folklore_eval*"]
